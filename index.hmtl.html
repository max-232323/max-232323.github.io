<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Länder Quiz Memory</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f2f6ff;
}
.container {
    margin-top: 50px;
}
button {
    display: block;
    margin: 10px auto;
    padding: 10px 20px;
    font-size: 16px;
}
#score {
    font-size: 20px;
    margin: 20px;
}
</style>
</head>
<body>

<div class="container">
    <h1>🌍 Länder Quiz</h1>
    <div id="score">Punkte: 0</div>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <button onclick="nextQuestion()">Nächste Frage</button>
</div>

<script>
const countries = [
["Deutschland","Berlin"],
["Frankreich","Paris"],
["Italien","Rom"],
["Spanien","Madrid"],
["Portugal","Lissabon"],
["Niederlande","Amsterdam"],
["Belgien","Brüssel"],
["Schweiz","Bern"],
["Österreich","Wien"],
["Polen","Warschau"],
["Tschechien","Prag"],
["Dänemark","Kopenhagen"],
["Schweden","Stockholm"],
["Norwegen","Oslo"],
["Finnland","Helsinki"],
["Griechenland","Athen"],
["Türkei","Ankara"],
["Ukraine","Kiew"],
["Russland","Moskau"],
["USA","Washington D.C."],
["Kanada","Ottawa"],
["Mexiko","Mexiko-Stadt"],
["Brasilien","Brasília"],
["Argentinien","Buenos Aires"],
["Chile","Santiago"],
["Peru","Lima"],
["Kolumbien","Bogotá"],
["Venezuela","Caracas"],
["Japan","Tokio"],
["China","Peking"],
["Südkorea","Seoul"],
["Indien","Neu-Delhi"],
["Pakistan","Islamabad"],
["Thailand","Bangkok"],
["Vietnam","Hanoi"],
["Indonesien","Jakarta"],
["Malaysia","Kuala Lumpur"],
["Philippinen","Manila"],
["Ägypten","Kairo"],
["Marokko","Rabat"],
["Algerien","Algier"],
["Nigeria","Abuja"],
["Südafrika","Pretoria"],
["Kenia","Nairobi"],
["Australien","Canberra"],
["Neuseeland","Wellington"],
["Saudi-Arabien","Riad"],
["Iran","Teheran"],
["Irak","Bagdad"],
["Israel","Jerusalem"]
];

let score = 0;
let current;

function nextQuestion() {
    current = countries[Math.floor(Math.random() * countries.length)];
    document.getElementById("question").innerText = "Hauptstadt von: " + current[0];

    let answers = [current[1]];

    while (answers.length < 4) {
        let random = countries[Math.floor(Math.random() * countries.length)][1];
        if (!answers.includes(random)) answers.push(random);
    }

    answers.sort(() => Math.random() - 0.5);

    let html = "";
    answers.forEach(ans => {
        html += `<button onclick="checkAnswer('${ans}')">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
}

function checkAnswer(ans) {
    if (ans === current[1]) {
        score++;
        alert("Richtig!");
    } else {
        alert("Falsch! Richtige Antwort: " + current[1]);
    }
    document.getElementById("score").innerText = "Punkte: " + score;
    nextQuestion();
}

nextQuestion();
</script>

</body>
</html>

input:focus {

}

button {

    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-weight: bold;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
}

button:active {
    transform: translateY(0);
}

#flag {
    font-size: 150px;
    margin: 30px 0;
    text-align: center;
}

.score {
    font-size: 24px;
    font-weight: bold;
    color: #667eea;
    text-align: center;
    margin: 20px 0;
    padding: 15px;
    background: #f0f4ff;
    border-radius: 8px;
}

#quizArea {
    display: none;
}

#startScreen {
    text-align: center;
}

.buttons-group {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

#result {
    text-align: center;
    font-size: 18px;
    margin: 15px 0;
    min-height: 30px;
}

.result-correct {
    color: #27ae60;
    font-weight: bold;
}

.result-wrong {
    color: #e74c3c;
    font-weight: bold;
}

@media (max-width: 600px) {
    .container {
        padding: 25px;
    }
    
    h1 {
        font-size: 2em;
    }
    
    #flag {
        font-size: 100px;
    }
    
    button {
        width: 90%;
        max-width: 200px;
    }
}
</style>
</head>

function startGame(selectedMode){
    let name = document.getElementById("playerName").value.trim();

    if(name === ""){
        alert("Bitte Namen eingeben!");
        return;
    }

    mode = selectedMode;
    score = 0;
    questionCount = 0;

    document.getElementById("startScreen").style.display="none";
    document.getElementById("quizArea").style.display="block";

    document.getElementById("welcome").innerHTML =
    "Willkommen, <b>" + name + "</b>!";

    nextQuestion();
}

function nextQuestion(){
    document.getElementById("answer").value="";
    document.getElementById("result").innerHTML="";
    
    questionCount++;

    if(mode==="land"){
        let item = countries[Math.floor(Math.random()*countries.length)];
        currentAnswer = item.country;
        document.getElementById("flag").innerHTML="";
        document.getElementById("question").innerHTML =

        item.capital +
        "</b>?</h3>";
    }else{
        let item = flags[Math.floor(Math.random()*flags.length)];
        currentAnswer = item.country;
        document.getElementById("question").innerHTML =
        "<h3>Frage " + questionCount + ": Zu welchem Land gehört diese Flagge?</h3>";
        document.getElementById("flag").innerHTML = item.flag;
    }
    
    document.getElementById("answer").focus();
}

function checkAnswer(){
    let answer = document.getElementById("answer").value.trim();
    let resultDiv = document.getElementById("result");

    if(answer.toLowerCase() === currentAnswer.toLowerCase()){
        score++;
        document.getElementById("score").innerText = score;
        resultDiv.className = "result-correct";
        resultDiv.innerHTML = "✅ Richtig!";

        if(score >= 50){
            setTimeout(() => {
                alert("🏆 GEWONNEN!\n\nDu hast 50 Punkte erreicht!\nGratuliere!");
                location.reload();
            },1000);
            return;
        }
    }else{
        resultDiv.className = "result-wrong";
        resultDiv.innerHTML = "❌ Falsch! Richtige Antwort: <b>" + currentAnswer + "</b>";
    }

    setTimeout(nextQuestion, 2000);
}

// Focus on name input when page loads
